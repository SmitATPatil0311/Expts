<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Azure PaaS Demo App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0078D4, #00B4FF);
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .container {
            background: white;
            color: #333;
            margin: 30px auto;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        input, button {
            padding: 10px;
            margin: 10px 0;
            width: 90%;
            font-size: 1rem;
        }

        button {
            background-color: #0078D4;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #005fa3;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            font-size: 0.9rem;
        }

        .info {
            margin-top: 15px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

<header>
    <h1>Platform as a Service Demo</h1>
    <p>Web App deployed on Azure Cloud</p>
</header>

<div class="container">
    <h2>Simple Greeting App</h2>
    
    <input type="text" id="nameInput" placeholder="Enter your name" />
    <button onclick="generateGreeting()">Submit</button>
    
    <div class="info" id="greetingMessage"></div>

    <hr>

    <h3>Environment Info</h3>
    <p id="envInfo">Running in browser...</p>
</div>

<footer>
    © 2026 Azure PaaS Demonstration
</footer>

<script>
    function generateGreeting() {
        const name = document.getElementById("nameInput").value;
        const message = document.getElementById("greetingMessage");

        if (name.trim() === "") {
            message.style.color = "red";
            message.textContent = "Please enter your name!";
        } else {
            message.style.color = "green";
            message.textContent = "Hello, " + name + "! Your app is running successfully on Azure!";
        }
    }

    // Display basic environment info
    document.getElementById("envInfo").textContent =
        "User Agent: " + navigator.userAgent;
</script>

</body>
</html>
